    <body id="body" style="background-image:url('./images/bg_sunny.png'); background-size:cover;"><!--날씨 배경 변경-->
        <div class="wrap">

                <div class="inner">

                <circle cx="24" cy="24" r="20" fill="none" stroke="#75ACFF" stroke-width="5" />
                <circle cx="24" cy="24" r="20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
                  <animate attributeName="stroke-dasharray" values="1, 200; 89, 200; 89, 200" dur="4s"
                    repeatCount="indefinite" />
                  <animate attributeName="stroke-dashoffset" values="0; -35; -124" dur="4s" repeatCount="indefinite" />
                </circle>
              </svg>
                </div>
                
            </div>
            <!-- s: header -->

                    <div class="w_info02">

                    </div>
                </div>
                <div class="header_btn">

                    <button class="btn" data-num="2">강남구</button>
                    <button class="btn" data-num="3">송파구</button>
